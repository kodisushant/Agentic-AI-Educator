services:
  - type: web
    name: ai-virtual-teacher-backend
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.agent.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: MOCK_MODE
        value: "true"
      - key: BACKEND_PORT
        value: "8000"
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CEREBRAS_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
